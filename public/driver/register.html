<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>司機註冊與資料登記 — 派單系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- LINE Seed TW Font -->
  <link rel="stylesheet" href="https://seed.line.me/src/css/line-seed-tw.css">
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Transitions.dev Custom Tokens -->
  <link rel="stylesheet" href="/css/transitions.css">
  <style>
    /* 全站套用 LINE 官方標準字體 LINE Seed TW */
    body, button, input, select, textarea {
      font-family: 'LINE Seed TW', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }
    /* 修正輸入框 focus 樣式，確保圓角完美對齊 */
    .custom-input-box {
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      background-color: #ffffff;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .custom-input-box:focus-within {
      border-color: #06c755;
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.15);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

  <!-- Main Container -->
  <div class="w-full max-w-md my-auto">
    
    <!-- Top Header / Branding -->
    <div class="text-center mb-5">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold mb-2.5 tracking-wider uppercase">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        TAXI DISPATCH PARTNER
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">
        司機夥伴登記
      </h1>
      <p class="text-sm text-slate-500 mt-1">
        完成車輛資料登記，即可開啟系統接單權限
      </p>
    </div>

    <!-- Registration Card (White Theme) -->
    <div id="form-card" class="bg-white rounded-2xl p-6 sm:p-7 card-shadow border border-slate-200/80 relative overflow-hidden">
      
      <!-- 品牌說明方塊 (需求 2: 標題保留品牌名稱，下方灰字簡單說明派單) -->
      <div class="flex items-center gap-3.5 p-4 rounded-xl bg-slate-50 border border-slate-200/80 mb-6">
        <div class="relative shrink-0">
          <img id="driver-avatar" src="https://placehold.co/80x80/06c755/ffffff?text=TAXI" alt="Avatar" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm">
          <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <h2 id="brand-title" class="text-sm font-bold text-slate-900 truncate">MG&MD 優質車隊派單系統</h2>
            <span id="badge-status" class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 text-emerald-700">在線服務</span>
          </div>
          <p class="text-xs text-slate-500 mt-1 leading-relaxed">
            系統即時媒合周邊乘客，出價接單 60 秒原子指派，保障透明與優先搶單。
          </p>
        </div>
      </div>

      <!-- Registration Form -->
      <form id="driver-form" class="space-y-4" onsubmit="return false;">
        
        <!-- 1. 司機名稱 -->
        <div class="t-input-wrap" id="wrap-name">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="displayName">
            1. 司機名稱 / 稱呼
          </label>
          <div class="t-input custom-input-box">
            <input type="text" id="displayName" placeholder="例如：凱開" required
                   class="w-full bg-transparent px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none rounded-xl">
          </div>
          <p class="t-error-msg">請輸入稱呼或司機名稱</p>
        </div>

        <!-- 2. 車牌號碼 -->
        <div class="t-input-wrap" id="wrap-plate">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="plateNumber">
            2. 車牌號碼
          </label>
          <div class="t-input custom-input-box">
            <input type="text" id="plateNumber" placeholder="例如：9808 或 TDC-8888" required
                   class="w-full bg-transparent px-4 py-3 text-sm text-slate-900 uppercase placeholder-slate-400 outline-none tracking-widest font-mono rounded-xl">
          </div>
          <p class="t-error-msg">請輸入完整車牌號碼</p>
        </div>

        <!-- 3. 車輛廠牌/型號 -->
        <div class="t-input-wrap" id="wrap-brand">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="carBrand">
            3. 車輛廠牌 / 型號
          </label>
          <div class="t-input custom-input-box">
            <input type="text" id="carBrand" placeholder="例如：Toyota CC、RAV4、Camry" required
                   class="w-full bg-transparent px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none rounded-xl">
          </div>
          <p class="t-error-msg">請輸入車型廠牌</p>
        </div>

        <!-- 4. 車輛顏色 -->
        <div class="t-input-wrap" id="wrap-color">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="carColor">
            4. 車輛顏色
          </label>
          <div class="t-input custom-input-box">
            <input type="text" id="carColor" placeholder="例如：藍灰、純白、黑" required
                   class="w-full bg-transparent px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none rounded-xl">
          </div>
          <p class="t-error-msg">請輸入車輛顏色（供乘客上車辨識）</p>
        </div>

        <!-- 5. 聯絡電話 (選填) -->
        <div class="t-input-wrap" id="wrap-phone">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="phone">
            5. 聯絡電話 (選填)
          </label>
          <div class="t-input custom-input-box">
            <input type="tel" id="phone" placeholder="0912-345-678"
                   class="w-full bg-transparent px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none rounded-xl">
          </div>
        </div>

        <!-- 6. 車內備註 / 乘車提醒事項 (選填，可自訂或快速點選) -->
        <div class="t-input-wrap" id="wrap-notes">
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700" for="driverNotes">
              6. 車內備註 / 提醒事項 (選填)
            </label>
            <span class="text-[11px] text-slate-400">乘客中單後可見</span>
          </div>
          <div class="t-input custom-input-box">
            <input type="text" id="driverNotes" value="🚭 禁菸 🚯 禁食" placeholder="例如：🚭 禁菸 🚯 禁食、可載小型寵物"
                   class="w-full bg-transparent px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none rounded-xl">
          </div>
          <!-- 快捷標籤 -->
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button type="button" onclick="setQuickNote('🚭 禁菸 🚯 禁食')" class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
              🚭 禁菸 🚯 禁食
            </button>
            <button type="button" onclick="setQuickNote('🚭 全車禁菸')" class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
              🚭 全車禁菸
            </button>
            <button type="button" onclick="setQuickNote('🐾 寵物友善車 (需籠推車)')" class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition">
              🐾 寵物友善
            </button>
          </div>
        </div>

        <!-- Submit Button with Transitions.dev Pro Glow -->
        <div class="pt-2">
          <button type="button" id="submit-btn" class="t-pro-btn w-full py-3.5 px-6">
            <span class="t-pro-btn-label text-white font-bold flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
              確認送出登記
            </span>
          </button>
        </div>

      </form>

      <!-- Status Toast / Alert -->
      <div id="status-box" class="hidden mt-4 p-3.5 rounded-xl text-xs font-medium text-center"></div>

    </div>

    <!-- Success Screen (需求 3: 表格呈現輸入資訊，下方有按鈕關閉) -->
    <div id="success-screen" class="hidden bg-white rounded-2xl p-6 sm:p-7 text-center card-shadow border border-slate-200">
      <div class="flex justify-center mb-3">
        <span class="t-success-check w-14 h-14 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center" data-state="out" id="success-check-icon">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 13l4 4L19 7" />
          </svg>
        </span>
      </div>
      <h2 class="text-xl font-bold text-slate-900 mb-1.5">資料建立完成！</h2>
      <p class="text-xs text-slate-500 mb-5">您已具備派單系統接單資格，官方機器人已將建檔結果同步回報至聊天室。</p>
      
      <!-- 結構化資訊表格 (Table 呈現) -->
      <div class="overflow-hidden rounded-xl border border-slate-200 mb-5">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold">
              <th class="py-2.5 px-4 w-1/3">登記項目</th>
              <th class="py-2.5 px-4 w-2/3">登記資料</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 text-slate-800">
            <tr>
              <td class="py-2.5 px-4 font-medium text-slate-500">司機稱呼</td>
              <td id="res-name" class="py-2.5 px-4 font-bold text-slate-900"></td>
            </tr>
            <tr class="bg-slate-50/50">
              <td class="py-2.5 px-4 font-medium text-slate-500">車牌號碼</td>
              <td id="res-plate" class="py-2.5 px-4 font-mono font-bold text-emerald-600 tracking-wider"></td>
            </tr>
            <tr>
              <td class="py-2.5 px-4 font-medium text-slate-500">車輛廠牌/型號</td>
              <td id="res-brand" class="py-2.5 px-4 font-medium"></td>
            </tr>
            <tr class="bg-slate-50/50">
              <td class="py-2.5 px-4 font-medium text-slate-500">車輛顏色</td>
              <td id="res-color" class="py-2.5 px-4 font-medium"></td>
            </tr>
            <tr>
              <td class="py-2.5 px-4 font-medium text-slate-500">聯絡電話</td>
              <td id="res-phone" class="py-2.5 px-4 font-medium text-slate-600"></td>
            </tr>
            <tr class="bg-slate-50/50">
              <td class="py-2.5 px-4 font-medium text-slate-500">車內提醒</td>
              <td id="res-notes" class="py-2.5 px-4 font-medium text-slate-800"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <button type="button" onclick="closeLiffWindow();" class="w-full py-3.5 px-6 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-98 text-white font-semibold text-sm transition shadow-sm flex items-center justify-center gap-2">
        <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        關閉視窗 (返回 LINE)
      </button>
    </div>

    <!-- Footer Security Note -->
    <p class="text-center text-[11px] text-slate-400 mt-5 flex items-center justify-center gap-1.5">
      <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      身分由 LINE 安全驗證保護，絕不外流個資
    </p>

  </div>

  <script src="/js/driver-register.js"></script>
</body>
</html>
