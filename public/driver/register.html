<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>司機註冊與資料登記 — 派單系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Transitions.dev Custom Tokens -->
  <link rel="stylesheet" href="/css/transitions.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
    .display-font {
      font-family: 'Outfit', sans-serif;
    }
    /* Glassmorphic card styling */
    .glass-card {
      background: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-amber-500 selection:text-black">

  <!-- Main Container -->
  <div class="w-full max-w-md my-auto">
    
    <!-- Top Header / Branding -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-semibold mb-3 tracking-wider uppercase">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        TAXI DISPATCH PARTNER
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white display-font">
        司機夥伴登記
      </h1>
      <p class="text-sm text-zinc-400 mt-1">
        完成車輛資料登記，即可開啟系統接單權限
      </p>
    </div>

    <!-- Registration Card -->
    <div id="form-card" class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
      
      <!-- User Profile Badge (LINE) -->
      <div class="flex items-center gap-3 p-3 rounded-xl bg-zinc-900/60 border border-zinc-800/80 mb-6">
        <div class="relative">
          <img id="driver-avatar" src="https://placehold.co/80x80/27272a/a1a1aa?text=LINE" alt="Avatar" class="w-11 h-11 rounded-full object-cover border border-zinc-700">
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-zinc-900 rounded-full"></span>
        </div>
        <div class="flex-1 min-w-0">
          <p id="driver-line-name" class="text-sm font-semibold text-white truncate">載入 LINE 身分中...</p>
          <p id="driver-line-id" class="text-xs text-zinc-500 truncate">驗證中...</p>
        </div>
      </div>

      <!-- Registration Form -->
      <form id="driver-form" class="space-y-4" onsubmit="return false;">
        
        <!-- 1. 司機名稱 -->
        <div class="t-input-wrap" id="wrap-name">
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5" for="displayName">
            1. 司機名稱 / 稱呼
          </label>
          <div class="t-input rounded-xl border border-zinc-800 bg-zinc-900/80 focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500 transition-all">
            <input type="text" id="displayName" placeholder="例如：凱開" required
                   class="w-full bg-transparent px-4 py-3 text-sm text-white placeholder-zinc-500 outline-none">
          </div>
          <p class="t-error-msg">請輸入稱呼或司機名稱</p>
        </div>

        <!-- 2. 車牌號碼 -->
        <div class="t-input-wrap" id="wrap-plate">
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5" for="plateNumber">
            2. 車牌號碼
          </label>
          <div class="t-input rounded-xl border border-zinc-800 bg-zinc-900/80 focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500 transition-all">
            <input type="text" id="plateNumber" placeholder="例如：9808 或 TDC-8888" required
                   class="w-full bg-transparent px-4 py-3 text-sm text-white uppercase placeholder-zinc-500 outline-none tracking-widest font-mono">
          </div>
          <p class="t-error-msg">請輸入完整車牌號碼</p>
        </div>

        <!-- 3. 車輛顏色 -->
        <div class="t-input-wrap" id="wrap-color">
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5" for="carColor">
            3. 車輛顏色
          </label>
          <div class="t-input rounded-xl border border-zinc-800 bg-zinc-900/80 focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500 transition-all">
            <input type="text" id="carColor" placeholder="例如：藍灰、純白、黑" required
                   class="w-full bg-transparent px-4 py-3 text-sm text-white placeholder-zinc-500 outline-none">
          </div>
          <p class="t-error-msg">請輸入車輛顏色（供乘客上車辨識）</p>
        </div>

        <!-- 4. 車輛廠牌/型號 -->
        <div class="t-input-wrap" id="wrap-brand">
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5" for="carBrand">
            4. 車輛廠牌 / 型號
          </label>
          <div class="t-input rounded-xl border border-zinc-800 bg-zinc-900/80 focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500 transition-all">
            <input type="text" id="carBrand" placeholder="例如：Toyota CC、RAV4、Camry" required
                   class="w-full bg-transparent px-4 py-3 text-sm text-white placeholder-zinc-500 outline-none">
          </div>
          <p class="t-error-msg">請輸入車型廠牌</p>
        </div>

        <!-- 5. 聯絡電話 (選填) -->
        <div class="t-input-wrap" id="wrap-phone">
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5" for="phone">
            5. 聯絡電話 (選填)
          </label>
          <div class="t-input rounded-xl border border-zinc-800 bg-zinc-900/80 focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500 transition-all">
            <input type="tel" id="phone" placeholder="0912-345-678"
                   class="w-full bg-transparent px-4 py-3 text-sm text-white placeholder-zinc-500 outline-none">
          </div>
        </div>

        <!-- Submit Button with Transitions.dev Pro Glow -->
        <div class="pt-3">
          <button type="button" id="submit-btn" class="t-pro-btn w-full py-3.5 px-6 shadow-lg shadow-amber-500/10 hover:shadow-amber-500/20 active:scale-95 transition-all">
            <span class="t-pro-btn-label text-amber-300 font-semibold flex items-center gap-2">
              <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
              確認送出登記
            </span>
          </button>
        </div>

      </form>

      <!-- Status Toast / Alert -->
      <div id="status-box" class="hidden mt-4 p-3 rounded-xl text-xs font-medium text-center"></div>

    </div>

    <!-- Success Screen (Transitions.dev Success Check) -->
    <div id="success-screen" class="hidden glass-card rounded-2xl p-8 text-center shadow-2xl">
      <div class="flex justify-center mb-4">
        <span class="t-success-check w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center" data-state="out" id="success-check-icon">
          <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 13l4 4L19 7" />
          </svg>
        </span>
      </div>
      <h2 class="text-xl font-bold text-white display-font mb-2">登記完成！</h2>
      <p class="text-sm text-zinc-400 mb-6">您已具備派單系統的接單資格，現在可以關閉此視窗或返回群組。</p>
      
      <div class="p-4 rounded-xl bg-zinc-900/60 border border-zinc-800 text-left space-y-2 mb-6 text-xs text-zinc-300">
        <div class="flex justify-between"><span class="text-zinc-500">司機姓名:</span><span id="res-name" class="font-medium text-white"></span></div>
        <div class="flex justify-between"><span class="text-zinc-500">車牌號碼:</span><span id="res-plate" class="font-mono text-amber-400"></span></div>
        <div class="flex justify-between"><span class="text-zinc-500">車輛顏色:</span><span id="res-color"></span></div>
        <div class="flex justify-between"><span class="text-zinc-500">車輛廠牌:</span><span id="res-brand"></span></div>
      </div>

      <button type="button" onclick="if (window.liff) liff.closeWindow();" class="w-full py-3 px-6 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white font-medium text-sm transition">
        關閉視窗 (返回 LINE)
      </button>
    </div>

    <!-- Footer Security Note -->
    <p class="text-center text-[11px] text-zinc-600 mt-6 flex items-center justify-center gap-1.5">
      <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      身分由 LINE 安全驗證保護，絕不外流個資
    </p>

  </div>

  <script src="/js/driver-register.js"></script>
</body>
</html>
