<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>調整訂單金額並回報 — 派單系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- LINE Seed TW Font -->
  <link rel="stylesheet" href="https://seed.line.me/src/css/line-seed-tw.css">
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body, button, input, select, textarea {
      font-family: 'LINE Seed TW', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

  <div class="w-full max-w-md my-auto">
    <!-- Header -->
    <div class="text-center mb-5">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold mb-2.5 tracking-wider">
        <span>💰</span> 客上結單金額回報
      </div>
      <h1 id="page-header-title" class="text-2xl font-bold tracking-tight text-slate-900">
        調整訂單金額並回報
      </h1>
      <p id="order-id-subtitle" class="text-xs text-slate-500 mt-1">
        預設帶入本筆訂單金額，確認或修改後送出即完成結單
      </p>
    </div>

    <!-- Main Card -->
    <div id="main-card" class="bg-white rounded-2xl p-6 card-shadow border border-slate-200/80 relative">
      
      <!-- Loading State -->
      <div id="loading-state" class="py-10 text-center space-y-3">
        <svg class="animate-spin w-8 h-8 mx-auto text-emerald-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <p class="text-sm font-semibold text-slate-700">正在讀取訂單與金額資訊...</p>
      </div>

      <!-- Form Content -->
      <div id="form-content" class="hidden space-y-5">
        <!-- 訂單上下車地點概要 -->
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2 text-xs">
          <div class="flex items-start gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 mt-1 shrink-0"></span>
            <div class="w-full">
              <p class="text-slate-400 font-medium">上車地點</p>
              <p id="pickup-addr-display" class="font-bold text-slate-900 text-sm mt-0.5">載入中...</p>
            </div>
          </div>
          <div class="flex items-start gap-2 pt-2 border-t border-slate-200/60">
            <span class="w-2 h-2 rounded-full bg-red-500 mt-1 shrink-0"></span>
            <div class="w-full">
              <p class="text-slate-400 font-medium">下車地點</p>
              <p id="dropoff-addr-display" class="font-bold text-slate-900 text-sm mt-0.5">載入中...</p>
            </div>
          </div>
        </div>

        <!-- 司機確認下車地點（乘客有填寫時預先帶入，沒寫的話司機可以補上） -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label for="dropoff-confirm-input" class="block text-xs font-bold text-slate-700">
              📍 確認下車地點（供偵測是否小於 5 公里短程單）：
            </label>
            <span id="dropoff-prefill-hint" class="text-[11px] font-semibold text-slate-400">
              乘客已填自動帶入
            </span>
          </div>
          <input
            type="text"
            id="dropoff-confirm-input"
            placeholder="乘客未填寫下車地點，請於此補上實際下車地點"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-bold text-slate-900 transition"
          >
          <p class="text-[11px] text-slate-400">
            💡 送出後系統將自動偵測上車與下車地點距離，若小於 5 公里即算短程單並送請管理員核實補單點數。
          </p>
        </div>

        <!-- 司機輸入結單金額 (若有詳細下車地址則預設帶入此筆訂單金額；若無詳細下車地址則為必填空白) -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label for="fare-input" class="block text-xs font-bold text-slate-700">
              💵 實際結單金額 (NT$) <span id="fare-required-badge" class="text-red-500 font-extrabold">* 必填</span>：
            </label>
            <span id="original-fare-hint" class="text-[11px] font-semibold text-emerald-700">
              原訂單金額：$--
            </span>
          </div>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-lg font-extrabold text-slate-500">$</span>
            <input 
              type="number" 
              id="fare-input" 
              required
              min="1"
              step="1"
              inputmode="numeric"
              placeholder="請輸入結單金額（必填）"
              class="w-full pl-9 pr-4 py-3.5 rounded-xl border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xl font-extrabold text-slate-900 transition"
            >
          </div>
          <p id="fare-error-msg" class="hidden text-xs font-bold text-red-600 mt-1">
            ⚠️ 請填寫本趟實際結單金額（此欄位為必填）！
          </p>
        </div>

        <!-- 備註欄位 (非必填) -->
        <div class="space-y-2">
          <label for="note-input" class="block text-xs font-bold text-slate-700">
            📝 備註（非必填）：
          </label>
          <textarea 
            id="note-input" 
            rows="3"
            placeholder="例如：乘客臨時更改目的地、等候加成、過路費等（非必填）"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm text-slate-900 transition font-medium"
          ></textarea>
        </div>

        <!-- 提交按鈕 -->
        <div class="pt-1 space-y-2">
          <button 
            type="button" 
            id="btn-submit-adjust-fare" 
            class="w-full py-3.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold text-sm transition flex items-center justify-center gap-2 shadow-sm"
          >
            <span>✅</span> 送出修改金額並回報結單
          </button>
          
          <button 
            type="button" 
            onclick="closeLiffWindow()" 
            class="w-full py-2.5 px-4 rounded-xl text-slate-400 hover:text-slate-600 text-xs font-medium transition"
          >
            返回 LINE
          </button>
        </div>
      </div>

      <!-- 成功畫面 -->
      <div id="success-screen" class="hidden py-8 text-center space-y-4">
        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-3xl font-bold">
          ✓
        </div>
        <h2 class="text-xl font-bold text-slate-900">訂單已完結並回報群組！</h2>
        <p id="success-desc" class="text-xs text-slate-600 leading-relaxed max-w-xs mx-auto">
          已將修改後的結單金額同步回報至司機群組聊天室，正在返回 LINE...
        </p>
      </div>

    </div>
  </div>

  <script src="/js/driver-adjust-fare.js"></script>
</body>
</html>
